<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting to badry.dev</title>
  <meta http-equiv="refresh" content="0; url=https://badry.dev/">
  <link rel="canonical" href="https://badry.dev/">
  <script>
    (function () {
      var target = "https://badry.dev" +
        location.pathname +
        location.search +
        location.hash;
      location.replace(target);
    })();
  </script>
</head>
<body>
  <p>This site has moved to <a href="https://badry.dev/">https://badry.dev/</a>.</p>
</body>
</html>
